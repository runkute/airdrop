# Nginx reverse proxy cho ClipForge
# Đặt file này vào /etc/nginx/sites-available/clipforge
# rồi: sudo ln -s /etc/nginx/sites-available/clipforge /etc/nginx/sites-enabled/
# sudo certbot --nginx -d yourdomain.com

server {
    listen 80;
    server_name yourdomain.com;          # <-- đổi thành domain thật

    # Certbot sẽ tự thêm SSL block bên dưới
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Stripe webhook cần raw body — tắt body buffering
        proxy_request_buffering off;

        # Next.js streaming (Server-Sent Events)
        proxy_buffering    off;
        proxy_read_timeout 120s;
    }
}
